{%- include upcoming-events.html -%}
<footer class="site-footer">
  <div class="wrap footer-inner">
    <nav class="footer-nav">
      {% for item in site.nav %}
      {% if item.events and upcoming_events.size == 0 %}{% continue %}{% endif %}
      <a href="{{ item.url }}"{% if item.events %} data-event-end="{{ upcoming_last_end.end | date_to_xmlschema }}"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
    <div class="social-links">
      <a href="{{ site.social.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn">LinkedIn</a>
      <a href="{{ site.social.youtube }}" target="_blank" rel="noopener" aria-label="YouTube">YouTube</a>
      <a href="{{ site.social.instagram }}" target="_blank" rel="noopener" aria-label="Instagram">Instagram</a>
    </div>
    <p class="copyright">&copy; {{ site.time | date: "%Y" }} Catherine R. Bell · <a href="/privacy/">Privacy</a></p>
  </div>
</footer>
