name: Deploy site

# The ONLY way the live site changes.
#
#   push to master  ->  all 6 CI checks  ->  deploy to GitHub Pages
#                                         ->  smoke test the live site
#
# If any check fails, nothing is deployed and the site keeps serving the
# last good version. If the post-deploy smoke test fails, the run goes red
# and GitHub emails the repo owner. See SECURITY-AND-CI.md for rollback.
#
# Requires: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
on:
  push:
    branches: [master, main]
  workflow_dispatch: {}

permissions: {}

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  deploy:
    name: Deploy to GitHub Pages
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # A unique package name per attempt, so "Re-run failed jobs" works
      # (otherwise the re-run finds two packages and refuses to publish).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          # GitHub's first publish after switching to Actions (domain and
          # HTTPS re-check) can take longer than the 10-minute default.
          timeout: 1800000

  smoke:
    name: Smoke test live site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site # only used to read the list of pages from sitemap.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Wait for the CDN to pick up the new version
        run: sleep 45
      - name: Read-only smoke tests against https://catherinerbell.com
        run: npx playwright test --grep @smoke
        env:
          CI: "true"
          BASE_URL: https://catherinerbell.com
