name: Weekly Ninth Moment draft

# Runs every Thursday at 9am Mountain Time (15:00 UTC during MDT, 16:00 UTC
# during MST. GitHub Actions cron is always UTC and doesn't shift for DST,
# so this is set for MDT; adjust the hour by 1 if it starts landing an hour
# off after a daylight-saving change). Giving a few days before the Monday
# newsletter send leaves time to review and merge.
#
# You can also fire this manually any time from the Actions tab (see
# workflow_dispatch below) without waiting for the schedule.
#
# SECURITY DESIGN
# - The job that holds ANTHROPIC_API_KEY ("draft") can only READ the repo.
#   It cannot push, open PRs, or change anything.
# - The job that can write ("open-pr") never sees the API key.
# - The key lives in the "ninth-moment" environment, which is restricted to
#   the master branch, so a workflow edited on any other branch cannot read it.
# - AI output (title, filename) is passed to shell commands only through
#   environment variables, never pasted into the script with ${{ }}, so a
#   malicious or malformed title cannot run commands.
on:
  schedule:
    - cron: "0 15 * * 4"
  workflow_dispatch: {}

# Nothing by default; each job asks for only what it needs.
permissions: {}

concurrency:
  group: ninth-moment-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ninth-moment
    permissions:
      contents: read
    outputs:
      post_title: ${{ steps.draft.outputs.post_title }}
      post_filename: ${{ steps.draft.outputs.post_filename }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Draft the post
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python .github/scripts/draft_weekly_post.py

      - name: Check the draft against house rules before anyone sees it
        run: python .github/scripts/content_guard.py

      - name: Hand the draft file to the next job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: draft-post
          path: _posts/${{ steps.draft.outputs.post_filename }}
          if-no-files-found: error
          retention-days: 3

  open-pr:
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write # lets this job start the CI checks on the new PR
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the draft file
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: draft-post
          path: _posts

      - name: Create branch, commit, and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_TITLE: ${{ needs.draft.outputs.post_title }}
          POST_FILENAME: ${{ needs.draft.outputs.post_filename }}
          REVIEWER: ${{ github.repository_owner }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # The filename comes from our own slugify(), but double-check it is
          # exactly the shape we expect before using it anywhere.
          if ! [[ "$POST_FILENAME" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.html$ ]]; then
            echo "Unexpected post filename: $POST_FILENAME" >&2
            exit 1
          fi

          BRANCH="ninth-moment/${POST_FILENAME%.html}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add "_posts/$POST_FILENAME"
          git commit -m "Draft: $POST_TITLE"
          git push origin "$BRANCH"

          cat > pr_body.txt <<'BODY_EOF'
          Weekly auto-drafted post, ready for review. Read it on the **Files changed** tab (it renders as a diff of the new file).

          The CI checks run automatically on this PR. Once they are green, merge it to publish: the deploy workflow rebuilds the site, tests it, and only then puts it live. Monday's Mailchimp RSS check will pick it up and email it to the Weekly Inspiration list.

          If it needs changes, leave a comment on this PR describing what to revise, or just close it without merging and nothing gets published.
          BODY_EOF

          gh pr create \
            --title "New Ninth Moment draft: $POST_TITLE" \
            --body-file pr_body.txt \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --reviewer "$REVIEWER"

          # PRs opened by the built-in token don't trigger pull_request
          # workflows (a GitHub safety rule). A manual dispatch is allowed,
          # and its results attach to this branch's commit, so the PR still
          # gets all of its required checks.
          gh workflow run ci.yml --ref "$BRANCH"
